
<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{
background:radial-gradient(circle at 20% 10%,#7b194f 0,#32104d 40%,#12081f 100%);
color:white;
}
.screen{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;transition:.5s}
.hidden{opacity:0;pointer-events:none;transform:scale(.97)}
.card{
width:min(92vw,430px);
padding:28px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(24px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 25px 70px rgba(0,0,0,.35);
text-align:center;
}
.cow{width:220px;height:auto;animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:42px;margin:10px 0}
p{font-size:18px;line-height:1.5}
button{
border:none;
padding:15px 30px;
border-radius:999px;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.2s;
}
button:active{transform:scale(.96)}
.primary{background:white;color:#e83d91;width:100%;margin-top:18px}
.play{position:relative;height:220px;margin-top:12px}
#yes{
position:absolute;
left:50%;
bottom:12px;
transform:translateX(-50%);
background:white;
color:#e83d91;
}
#no{
position:absolute;
left:50%;
top:12px;
transform:translateX(-50%);
background:#17131e;
color:white;
touch-action:none;
}
.counter{font-size:13px;opacity:.7;margin-top:8px}
.big{font-size:70px}
.heart{
position:fixed;
bottom:-20px;
font-size:22px;
pointer-events:none;
animation:rise linear forwards;
}
@keyframes rise{
to{
transform:translateY(-120vh) rotate(30deg);
opacity:0;
}
}
.confetti{
position:fixed;
top:-20px;
width:10px;
height:18px;
border-radius:3px;
animation:fall linear forwards;
}
@keyframes fall{
to{
transform:translate3d(var(--x),110vh,0) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<p>You finally caught the No button after 25 attempts.</p>
</div>
</section>

<script>
const intro=document.getElementById("intro")
const proposal=document.getElementById("proposal")
const yesScreen=document.getElementById("yesScreen")
const noScreen=document.getElementById("noScreen")
const openBtn=document.getElementById("openBtn")
const yes=document.getElementById("yes")
const no=document.getElementById("no")
const play=document.getElementById("playArea")
const count=document.getElementById("count")

let attempts=0

openBtn.onclick=()=>{
intro.classList.add("hidden")
setTimeout(()=>proposal.classList.remove("hidden"),300)
for(let i=0;i<20;i++)setTimeout(heart,i*90)
}

function heart(){
const h=document.createElement("div")
h.className="heart"
h.textContent=["💖","💕","💗","✨"][Math.floor(Math.random()*4)]
h.style.left=Math.random()*100+"vw"
h.style.animationDuration=(3+Math.random()*2)+"s"
document.body.appendChild(h)
setTimeout(()=>h.remove(),5000)
}

function dodge(e){
e.preventDefault()
e.stopPropagation()
if(attempts>=25)return
attempts++
count.textContent=attempts
const x=Math.random()*(play.clientWidth-no.offsetWidth)
const y=Math.random()*(play.clientHeight-no.offsetHeight)
no.style.left=x+"px"
no.style.top=y+"px"
no.style.transform="none"
navigator.vibrate&&navigator.vibrate(18)
if(attempts===25){
setTimeout(()=>{
proposal.classList.add("hidden")
noScreen.classList.remove("hidden")
},180)
}
}

["pointerdown","pointerenter","touchstart","click"].forEach(ev=>{
no.addEventListener(ev,dodge,{passive:false})
})

yes.onclick=()=>{
proposal.classList.add("hidden")
setTimeout(()=>yesScreen.classList.remove("hidden"),300)
confetti()
for(let i=0;i<50;i++)setTimeout(heart,i*60)
}

function confetti(){
for(let i=0;i<180;i++){
const c=document.createElement("div")
c.className="confetti"
c.style.left=Math.random()*100+"vw"
c.style.setProperty("--x",(Math.random()*240-120)+"px")
c.style.background=`hsl(${Math.random()*360},95%,65%)`
c.style.animationDuration=(2+Math.random()*2)+"s"
document.body.appendChild(c)
setTimeout(()=>c.remove(),4500)
}
}
</script>

</body>
